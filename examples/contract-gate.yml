# examples/contract-gate.yml — catch breaking + tool-poisoning contract changes on every PR.
#
# "VCR for MCP": commit a recorded snapshot of your server's contract, then gate
# each PR against it. Fails on breaking schema changes (removed tools, new
# required args, narrowed enums) AND on security signals (tool-description
# mutations = the rug-pull / tool-poisoning vector, dropped read-only hints).
#
# Requires @incultnitollc/mcp-probe >= 1.2.0 (record / diff / gate).
#
# ── One-time setup ──────────────────────────────────────────────────────────
#   npm run build
#   npx @incultnitollc/mcp-probe record 'node dist/index.js' --out .mcp/contract.mcpvcr
#   git add .mcp/contract.mcpvcr && git commit -m "chore: record MCP contract baseline"
#
# Re-record and commit whenever an intended contract change is reviewed & approved.

name: MCP contract gate

on:
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the diff comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm run build

      # Gate the current build against the committed baseline. Records the live
      # surface (no tool calls), diffs it, writes a PR-comment markdown report,
      # and exits non-zero on any breaking or security change.
      - name: Contract gate
        id: gate
        run: |
          npx @incultnitollc/mcp-probe gate \
            --baseline .mcp/contract.mcpvcr \
            'node dist/index.js' \
            --markdown "$RUNNER_TEMP/contract-diff.md"

      # Post the diff on the PR whether the gate passed or failed.
      - name: Comment contract diff
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/contract-diff.md`;
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
