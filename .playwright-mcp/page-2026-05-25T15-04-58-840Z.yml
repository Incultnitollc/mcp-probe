              - generic [ref=e140]:
                - generic [ref=e263]:
                  - paragraph [ref=e268]:
                    - text: For MCP server schemas, the main best practice is to keep the tool description high-level and put parameter-specific guidance in the input schema itself, with clear types, constraints, and examples where helpful. Strong schemas are specific, validate aggressively, and stay consistent in their return shapes so both models and developers can predict how a tool behaves.
                    - generic [ref=e273] [cursor=pointer]:
                      - generic [ref=e274]: github
                      - generic [ref=e275]: "+1"
                  - heading "Schema design" [level=2] [ref=e280]
                  - paragraph [ref=e285]:
                    - text: Use small, single-purpose tools instead of broad “do everything” endpoints, because narrow schemas are easier to understand, test, and compose into workflows. In the schema, define required fields explicitly, use exact types, and add constraints such as min/max values, allowed enums, and length limits to reduce invalid calls.
                    - generic "MCP development best practices - YouTube" [ref=e287]:
                      - link "youtube" [ref=e289] [cursor=pointer]:
                        - /url: https://www.youtube.com/watch?v=W56H9W7x-ao
                        - generic [ref=e291]:
                          - img [ref=e293]
                          - generic [ref=e295]: youtube
                    - 'generic "SEP-1382: Documentation Best Practices for MCP Tools" [ref=e297]':
                      - link "github" [ref=e299] [cursor=pointer]:
                        - /url: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1382
                        - generic [ref=e302]: github
                  - heading "Documentation split" [level=2] [ref=e307]
                  - paragraph [ref=e312]:
                    - text: Keep the tool-level description focused on what the tool does and when to use it, without repeating every parameter detail. Put parameter descriptions in the schema so the model sees what each field means, what it expects, and how fields relate to one another.
                    - 'generic "SEP-1382: Documentation Best Practices for MCP Tools" [ref=e314]':
                      - link "github" [ref=e316] [cursor=pointer]:
                        - /url: https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1382
                        - generic [ref=e319]: github
                  - heading "Validation and safety" [level=2] [ref=e324]
                  - paragraph [ref=e329]:
                    - text: Validate all inputs, including empty strings, unexpected formats, and excessively long values, because schema checks alone are not enough for security. If a tool touches protected data, require authorization before access and redact sensitive output by default unless the user is allowed to see it.
                    - generic "MCP development best practices - YouTube" [ref=e331]:
                      - link "youtube" [ref=e333] [cursor=pointer]:
                        - /url: https://www.youtube.com/watch?v=W56H9W7x-ao
                        - generic [ref=e335]:
