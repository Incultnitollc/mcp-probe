                    - generic "Security Best Practices - Model Context Protocol" [ref=e341]:
                      - link "modelcontextprotocol" [ref=e343] [cursor=pointer]:
                        - /url: https://modelcontextprotocol.io/docs/tutorials/security/security_best_practices
                        - generic [ref=e346]: modelcontextprotocol
                  - heading "Response shape" [level=2] [ref=e351]
                  - paragraph [ref=e356]:
                    - text: Make responses predictable and stable, ideally with the same top-level keys every time, even when an error occurs. Return structured error objects with enough detail to help the client recover, rather than throwing vague failures or crashing the whole request flow.
