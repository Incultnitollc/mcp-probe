                - heading "Gemini said" [level=2] [ref=e229]
                - generic [ref=e233]:
                  - paragraph [ref=e234]:
                    - text: In the context of the Model Context Protocol (MCP), the
                    - code [ref=e235]: description
                    - text: field is more than just "documentation"—it is a critical piece of functional metadata.
                  - paragraph [ref=e236]: "If a description is missing or poorly written, it directly impacts how the AI (the \"Client\") perceives and utilizes that tool. Here is a breakdown of what happens when that field is blank or inadequate:"
                  - separator [ref=e237]
                  - heading "1. The Model Loses \"Intent Mapping\"" [level=3] [ref=e238]
                  - paragraph [ref=e239]: Think of the tool name as a label and the description as the instruction manual.
                  - list [ref=e240]:
                    - listitem [ref=e241]:
                      - paragraph [ref=e242]:
                        - text: "With a description: The AI understands when and why to call the tool. For example, if a tool is named"
                        - code [ref=e243]: fetch_data
                        - text: ", a description like \"Retrieves real-time stock prices for a given ticker\" tells the AI to use it when the user asks about market trends."
                    - listitem [ref=e244]:
                      - paragraph [ref=e245]:
                        - text: "Without a description: The AI has to guess based solely on the name. If the name is ambiguous (like"
                        - code [ref=e246]: process_info
                        - text: ), the AI might never call it, or worse, call it at the wrong time.
                  - heading "2. Hallucination Risk" [level=3] [ref=e247]
                  - paragraph [ref=e248]: When an LLM sees a tool with no description, it may try to "hallucinate" the tool’s purpose based on its parameters.
                  - list [ref=e249]:
                    - listitem [ref=e250]:
                      - paragraph [ref=e251]:
                        - text: If you have a parameter called
                        - code [ref=e252]: id
                        - text: ", and no tool description, the AI might assume it's a User ID, a Post ID, or a Product ID depending on the conversation context, leading to incorrect API calls."
                  - heading "3. Reduced Parameter Accuracy" [level=3] [ref=e253]
                  - paragraph [ref=e254]: "MCP descriptions often explain the format or constraints of input variables. Missing descriptions for the tool (and its individual arguments) mean the AI is likely to provide:"
                  - list [ref=e255]:
                    - listitem [ref=e256]:
                      - paragraph [ref=e257]: The wrong data types (e.g., string vs. integer).
                    - listitem [ref=e258]:
                      - paragraph [ref=e259]: Values in the wrong units (e.g., seconds vs. milliseconds).
                    - listitem [ref=e260]:
                      - paragraph [ref=e261]: Invalid syntax for complex queries.
                  - heading "4. Categorization Failures" [level=3] [ref=e262]
                  - paragraph [ref=e263]: Many MCP clients (like Claude Desktop or custom IDE integrations) use descriptions to index and categorize available tools.
                  - list [ref=e264]:
                    - listitem [ref=e265]:
                      - paragraph [ref=e266]: A missing description might cause the tool to be filtered out or deprioritized in the model's "context window," effectively making the tool invisible to the AI during a session.
