                  - generic [ref=e233]:
                    - paragraph [ref=e284]:
                      - text: In the context of the Model Context Protocol (MCP), the
                      - code [ref=e285]: description
                      - text: field is more than just "documentation"—it is a critical piece of functional metadata.
                    - paragraph [ref=e286]: "If a description is missing or poorly written, it directly impacts how the AI (the \"Client\") perceives and utilizes that tool. Here is a breakdown of what happens when that field is blank or inadequate:"
                    - separator [ref=e287]
                    - heading "1. The Model Loses \"Intent Mapping\"" [level=3] [ref=e288]
                    - paragraph [ref=e289]: Think of the tool name as a label and the description as the instruction manual.
                    - list [ref=e290]:
                      - listitem [ref=e291]:
                        - paragraph [ref=e292]:
                          - text: "With a description: The AI understands when and why to call the tool. For example, if a tool is named"
                          - code [ref=e293]: fetch_data
                          - text: ", a description like \"Retrieves real-time stock prices for a given ticker\" tells the AI to use it when the user asks about market trends."
                      - listitem [ref=e294]:
                        - paragraph [ref=e295]:
                          - text: "Without a description: The AI has to guess based solely on the name. If the name is ambiguous (like"
                          - code [ref=e296]: process_info
                          - text: ), the AI might never call it, or worse, call it at the wrong time.
                    - heading "2. Hallucination Risk" [level=3] [ref=e297]
                    - paragraph [ref=e298]: When an LLM sees a tool with no description, it may try to "hallucinate" the tool’s purpose based on its parameters.
                    - list [ref=e299]:
                      - listitem [ref=e300]:
                        - paragraph [ref=e301]:
                          - text: If you have a parameter called
                          - code [ref=e302]: id
                          - text: ", and no tool description, the AI might assume it's a User ID, a Post ID, or a Product ID depending on the conversation context, leading to incorrect API calls."
                    - heading "3. Reduced Parameter Accuracy" [level=3] [ref=e303]
                    - paragraph [ref=e304]: "MCP descriptions often explain the format or constraints of input variables. Missing descriptions for the tool (and its individual arguments) mean the AI is likely to provide:"
                    - list [ref=e305]:
                      - listitem [ref=e306]:
                        - paragraph [ref=e307]: The wrong data types (e.g., string vs. integer).
                      - listitem [ref=e308]:
                        - paragraph [ref=e309]: Values in the wrong units (e.g., seconds vs. milliseconds).
                      - listitem [ref=e310]:
                        - paragraph [ref=e311]: Invalid syntax for complex queries.
                    - heading "4. Categorization Failures" [level=3] [ref=e312]
                    - paragraph [ref=e313]: Many MCP clients (like Claude Desktop or custom IDE integrations) use descriptions to index and categorize available tools.
                    - list [ref=e314]:
                      - listitem [ref=e315]:
                        - paragraph [ref=e316]: A missing description might cause the tool to be filtered out or deprioritized in the model's "context window," effectively making the tool invisible to the AI during a session.
