              - listitem [ref=e286]:
                - generic [ref=e287]:
                  - strong [ref=e288]: Use Schema Examples
                  - text: ": Include valid structural examples inside your JSON schema metadata. This provides few-shot contextual hints directly to the LLM at the moment of tool selection."
