            - generic [ref=e173]:
              - text: When designing schemas for Model Context Protocol (MCP) servers, you are writing an API specifically for Large Language Models (LLMs), not human developers. Poorly designed schemas cause models to hallucinate arguments, make unnecessary API round-trips, and exhaust context windows.
              - generic [ref=e175]:
