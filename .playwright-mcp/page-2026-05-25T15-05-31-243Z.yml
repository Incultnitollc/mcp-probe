            - heading "1. Structure Arguments for AI Consumption" [level=3] [ref=e190]
            - list [ref=e191]:
              - listitem [ref=e192]:
                - generic [ref=e193]:
                  - strong [ref=e194]: Flatten Your Arguments
                  - text: ": Convert deeply nested JSON objects into a single, flat list of top-level parameters. LLMs frequently hallucinate keys or misplace fields when handling nested configurations."
              - listitem [ref=e195]:
                - generic [ref=e196]:
                  - strong [ref=e197]: Reduce Required Parameters
                  - text: ": Use sensible default values to minimize the number of fields the model must generate."
              - listitem [ref=e198]:
                - generic [ref=e199]:
                  - strong [ref=e200]: Constrain Types with Enums
                  - text: ": Do not leave parameters open-ended. Use literal strings or enums (e.g.,"
                  - code [ref=e201]: "status: Literal[\"pending\", \"shipped\", \"delivered\"]"
                  - text: ) to narrow down the model's choices.
                - generic [ref=e203]:
