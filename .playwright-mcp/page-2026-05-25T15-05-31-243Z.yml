            - heading "2. Design for \"Outcomes, Not Operations\"" [level=3] [ref=e242]
            - list [ref=e243]:
              - listitem [ref=e244]:
                - generic [ref=e245]:
                  - strong [ref=e246]: Avoid 1:1 REST Wrappers
                  - text: ": Do not map your underlying REST API endpoints directly to individual MCP tools. This forces the model to execute multiple round-trips to complete a simple task."
              - listitem [ref=e247]:
                - generic [ref=e248]:
                  - strong [ref=e249]: Expose Orchestrated Tools
                  - text: ": Combine multiple atomic backend steps into a single, high-level intent-based tool. For example, replace individual tools like"
                  - code [ref=e250]: get_user()
                  - text: ","
                  - code [ref=e251]: list_orders()
                  - text: ", and"
                  - code [ref=e252]: get_order_status()
                  - text: with a single
                  - code [ref=e253]: track_latest_order(email)
                  - text: tool.
              - listitem [ref=e254]:
                - generic [ref=e255]:
                  - strong [ref=e256]: Curate Ruthlessly
                  - text: ": Keep your server focused on a single responsibility. Expose only 5–15 tools per server to avoid overwhelming the model's context window."
                - generic [ref=e258]:
                  - link "Philschmid (+4) – View related links" [ref=e259] [cursor=pointer]:
