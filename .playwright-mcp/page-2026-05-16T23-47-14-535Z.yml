            - heading "1. Structure for LLM Readability" [level=3] [ref=e184]
            - list [ref=e185]:
              - listitem [ref=e186]:
                - generic [ref=e187]:
                  - strong [ref=e188]: Flatten Your Arguments
                  - text: ": Avoid deeply nested JSON objects. Convert nested structures into top-level primitive keys (strings, numbers, booleans) so the LLM can map parameters accurately."
              - listitem [ref=e189]:
                - generic [ref=e190]:
                  - strong [ref=e191]: Strict Type Constraints
                  - text: ": Use"
                  - code [ref=e192]: enum
                  - text: or
                  - code [ref=e193]: Literal
                  - text: types wherever possible to limit the model's choices (e.g.,
                  - code [ref=e194]: "status: [\"pending\", \"active\"]"
                  - text: ). This minimizes formatting hallucinations.
              - listitem [ref=e195]:
                - generic [ref=e196]:
                  - strong [ref=e197]: Reduce Required Parameters
                  - text: ": Rely heavily on sensible defaults within your server logic. The fewer required decisions an AI has to make, the higher its execution success rate."
              - listitem [ref=e198]:
                - generic [ref=e199]:
                  - strong [ref=e200]: Enforce Strict Schema Rules
                  - text: ": Explicitly set"
                  - code [ref=e201]: "additionalProperties: false"
                  - text: in your JSON schema definitions. This blocks the LLM from inventing parameters that your server cannot process.
                - generic [ref=e203]:
                  - link "Philschmid (+4) – View related links" [ref=e204] [cursor=pointer]:
                    - /url: https://www.philschmid.de/mcp-best-practices
                  - button "Philschmid (+4) – View related links" [ref=e205] [cursor=pointer]:
                    - generic [ref=e207]:
