            - generic [ref=e173]:
              - text: When designing schemas for Model Context Protocol (MCP) servers, you are
              - mark [ref=e174]:
                - text: writing an interface meant for
                - strong [ref=e175]: AI consumption rather than human consumption
              - text: . While traditional REST APIs favor highly flexible, nested, and granular models, Large Language Models (LLMs) thrive on clarity, constraints, and flat structures.
              - generic [ref=e177]:
                - link "Philschmid (+4) – View related links" [ref=e178] [cursor=pointer]:
                  - /url: https://www.philschmid.de/mcp-best-practices
