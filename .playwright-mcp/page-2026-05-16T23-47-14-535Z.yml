            - heading "2. Craft Precise Descriptions" [level=3] [ref=e210]
            - list [ref=e211]:
              - listitem [ref=e212]:
                - generic [ref=e213]:
                  - strong [ref=e214]: Tool Descriptions as Instructions
                  - text: ": Think of the top-level tool"
                  - code [ref=e215]: description
                  - text: as a system prompt. Explicitly state
                  - emphasis [ref=e216]: when
                  - text: to use it (e.g.,
                  - code [ref=e217]: "\"Use this tool only when the user explicitly requests a shipping status update.\""
                  - text: ).
              - listitem [ref=e218]:
                - generic [ref=e219]:
                  - strong [ref=e220]: Hyper-Specific Parameter Descriptions
                  - text: ": Never use vague labels like \"ID\". Use explicit, pattern-based descriptions:"
                  - code [ref=e221]: "\"The 24-character unique user identifier string starting with 'usr_'.\""
              - listitem [ref=e222]:
                - generic [ref=e223]:
                  - strong [ref=e224]: Provide Format Examples
                  - text: ": If a parameter requires specific formatting, explicitly include it in the description field (e.g.,"
                  - code [ref=e225]: "\"The target date formatted strictly as YYYY-MM-DD.\""
                  - text: ).
