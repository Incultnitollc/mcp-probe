            - heading "3. Handle Scale and Pagination Safely" [level=3] [ref=e234]
            - list [ref=e235]:
              - listitem [ref=e236]:
                - generic [ref=e237]:
                  - strong [ref=e238]: Enforce Strict Limits
                  - text: ": Always include a"
                  - code [ref=e239]: limit
                  - text: parameter in list operations. Define a low default (e.g.,
                  - code [ref=e240]: "20"
                  - text: ) and cap the maximum allowable value (e.g.,
                  - code [ref=e241]: "maximum: 100"
                  - text: ) inside the schema to safeguard the LLM's context window.
              - listitem [ref=e242]:
