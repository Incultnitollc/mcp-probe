                    - paragraph [ref=e352]: Example pipeline jobs
                    - list [ref=e353]:
                      - listitem [ref=e354]:
                        - paragraph [ref=e355]:
                          - text: "GitLab CI (concept): add a dedicated mcp-check stage that spins up an MCP server as a service, points the CLI at that service, and fails the pipeline if validation fails."
                          - generic "Integrating MCP Servers into Your CI/CD Pipeline with GitLab and Docker" [ref=e357]:
                            - link "bleevht.substack" [ref=e359] [cursor=pointer]:
                              - /url: https://bleevht.substack.com/p/integrating-mcp-servers-into-your
                              - generic [ref=e362]: bleevht.substack
                        - list [ref=e363]:
                          - listitem [ref=e364]:
                            - paragraph [ref=e365]:
                              - text: "Key parts: stages include build → mcp-check → package; use CI services to run the MCP container; run mcp-cli validate --server $MCP_SERVER_ADDR --config mcp-config.hcl."
                              - generic "Integrating MCP Servers into Your CI/CD Pipeline with GitLab and Docker" [ref=e367]:
                                - link "bleevht.substack" [ref=e369] [cursor=pointer]:
                                  - /url: https://bleevht.substack.com/p/integrating-mcp-servers-into-your
                                  - generic [ref=e372]: bleevht.substack
                      - listitem [ref=e373]:
                        - paragraph [ref=e374]:
                          - text: "GitHub Actions (concept): use a job that either (a) runs an MCP container via a service container, or (b) calls an externally hosted MCP endpoint; then run validation and gate subsequent jobs with job outputs/conditions."
                          - generic [ref=e379] [cursor=pointer]:
                            - generic [ref=e380]: prefactor
                            - generic [ref=e381]: "+1"
                      - listitem [ref=e382]:
                        - paragraph [ref=e383]:
                          - text: "Jenkins (concept): use a pipeline step that launches the MCP server container (or contacts an existing MCP service), executes validation steps, and marks the build unstable/failed based on MCP responses. Reusable Jenkins shared-library steps exist in community repos for MCP integration."
