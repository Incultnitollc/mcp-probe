                    - paragraph [ref=e313]: Yes — you can add an MCP server into a CI pipeline to run model-specific validation, orchestration, and automated checks before packaging or deploying artifacts. Below I give a concise, practical plan (requirements, example jobs for GitHub Actions/GitLab CI/Jenkins, config tips, and testing) so you can integrate an MCP server into your CI quickly.
                    - paragraph [ref=e314]: What you need
                    - list [ref=e315]:
                      - listitem [ref=e316]:
                        - paragraph [ref=e317]:
                          - text: MCP server container or service reachable from CI jobs (run as a CI service or call a managed endpoint).
                          - generic "Integrating MCP Servers into Your CI/CD Pipeline with GitLab and Docker" [ref=e319]:
                            - link "bleevht.substack" [ref=e321] [cursor=pointer]:
                              - /url: https://bleevht.substack.com/p/integrating-mcp-servers-into-your
                              - generic [ref=e324]: bleevht.substack
                      - listitem [ref=e325]:
                        - paragraph [ref=e326]:
                          - text: A small MCP configuration file that maps models, contexts, and validation rules (for example, mcp-config.hcl).
                          - generic "Integrating MCP Servers into Your CI/CD Pipeline with GitLab and Docker" [ref=e328]:
                            - link "bleevht.substack" [ref=e330] [cursor=pointer]:
                              - /url: https://bleevht.substack.com/p/integrating-mcp-servers-into-your
                              - generic [ref=e333]: bleevht.substack
                      - listitem [ref=e334]:
                        - paragraph [ref=e335]:
                          - text: CI runners that can run containers (Docker-in-Docker or self-hosted runners) so the MCP service can be launched or accessed during the job.
