                    - paragraph [ref=e391]: How MCP checks typically work
                    - list [ref=e392]:
                      - listitem [ref=e393]:
                        - paragraph [ref=e394]:
                          - text: The MCP config ties models to context payloads and rules (for linting, safety checks, deterministic outputs, or functional assertions). CI jobs submit those contexts to the MCP server and assert success/failure based on returned validation results.
                          - generic [ref=e399] [cursor=pointer]:
                            - generic [ref=e400]: mcp-server-langgraph.mintlify
                            - generic [ref=e401]: "+1"
                      - listitem [ref=e402]:
                        - paragraph [ref=e403]:
                          - text: You can run both small quick checks on every commit and longer, expanded validation on PRs or release branches.
                          - generic [ref=e408] [cursor=pointer]:
                            - generic [ref=e409]: glama
                            - generic [ref=e410]: "+1"
                    - paragraph [ref=e411]: Scaling and orchestration patterns
                    - list [ref=e412]:
                      - listitem [ref=e413]:
                        - paragraph [ref=e414]:
                          - text: For large test suites or many model checks, use MCP for test chunking, parallel distribution (independent vs dependent groups), and result aggregation so the CI stays performant and results are centralized.
                          - generic "How We Successfully Scaled 5,000+ Automated Test Cases in Our CI/CD Pipeline Using MCP Server" [ref=e416]:
                            - link "medium" [ref=e418] [cursor=pointer]:
                              - /url: https://medium.com/@kapilkumar080/how-we-successfully-scaled-5-000-automated-test-cases-in-our-ci-cd-pipeline-using-mcp-server-7bbb9614a5f4
                              - generic [ref=e421]: medium
                      - listitem [ref=e422]:
                        - paragraph [ref=e423]:
                          - text: Aggregate MCP results into your CI reporting (Allure/HTML) and alerting channels (Slack, email) for visibility.
                          - generic "How We Successfully Scaled 5,000+ Automated Test Cases in Our CI/CD Pipeline Using MCP Server" [ref=e425]:
                            - link "medium" [ref=e427] [cursor=pointer]:
                              - /url: https://medium.com/@kapilkumar080/how-we-successfully-scaled-5-000-automated-test-cases-in-our-ci-cd-pipeline-using-mcp-server-7bbb9614a5f4
                              - generic [ref=e430]: medium
                    - paragraph [ref=e431]: Practical configuration tips
                    - list [ref=e432]:
                      - listitem [ref=e433]:
                        - paragraph [ref=e434]:
                          - text: Keep a compact mcp-config.hcl (or YAML) in the repo listing the model(s), prompt templates, and validation rules used for CI checks so validation is reproducible.
                          - generic "Integrating MCP Servers into Your CI/CD Pipeline with GitLab and Docker" [ref=e436]:
                            - link "bleevht.substack" [ref=e438] [cursor=pointer]:
                              - /url: https://bleevht.substack.com/p/integrating-mcp-servers-into-your
                              - generic [ref=e441]: bleevht.substack
                      - listitem [ref=e442]:
                        - paragraph [ref=e443]:
                          - text: Use CI service containers (or self-hosted runners with Docker) to ensure the MCP server is reachable at a predictable hostname (e.g., mcp-server:50051) inside the job.
                          - generic [ref=e448] [cursor=pointer]:
                            - generic [ref=e449]: prefactor
                            - generic [ref=e450]: "+1"
                      - listitem [ref=e451]:
                        - paragraph [ref=e452]:
                          - text: Fail fast on critical checks (security, safety, functional regressions) and allow non-blocking checks (performance profiling, optional lint rules) to be allowed to fail if you want.
                          - generic "Integrating MCP Servers into Your CI/CD Pipeline with GitLab and Docker" [ref=e454]:
                            - link "bleevht.substack" [ref=e456] [cursor=pointer]:
                              - /url: https://bleevht.substack.com/p/integrating-mcp-servers-into-your
                              - generic [ref=e459]: bleevht.substack
