                            - generic [ref=e398]: cursor
                    - listitem [ref=e399]:
                      - paragraph [ref=e400]:
                        - text: "Fix: add a 2–3 sentence description explaining purpose, required fields, allowed values, and include an example arguments payload; after this, agents supply the correct fields more consistently."
