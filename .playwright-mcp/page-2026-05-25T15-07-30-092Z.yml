                  - paragraph [ref=e350]: How to fix or mitigate missing descriptions
                  - list [ref=e351]:
                    - listitem [ref=e352]:
                      - paragraph [ref=e353]:
                        - text: "Add a concise purpose statement: what the tool does and what it returns."
                        - generic "MCP Tool Descriptions Are Smelly and Costly - LinkedIn" [ref=e355]:
                          - link "linkedin" [ref=e357] [cursor=pointer]:
                            - /url: https://www.linkedin.com/posts/danielwebbuk_model-context-protocol-mcp-tool-descriptions-activity-7452688347128557568-oS5c
                            - generic [ref=e360]: linkedin
                    - listitem [ref=e361]:
                      - paragraph [ref=e362]:
                        - text: Document parameters (names, types, required/optional, constraints) and give one example call.
                        - generic [ref=e367] [cursor=pointer]:
                          - generic [ref=e368]: github
                          - generic [ref=e369]: "+1"
                    - listitem [ref=e370]:
                      - paragraph [ref=e371]:
                        - text: Add usage guidelines and limitations (when not to use the tool).
                        - generic "MCP Tool Descriptions Are Smelly and Costly - LinkedIn" [ref=e373]:
                          - link "linkedin" [ref=e375] [cursor=pointer]:
                            - /url: https://www.linkedin.com/posts/danielwebbuk_model-context-protocol-mcp-tool-descriptions-activity-7452688347128557568-oS5c
                            - generic [ref=e378]: linkedin
                    - listitem [ref=e379]:
                      - paragraph [ref=e380]:
                        - text: Monitor logs for validation errors and “near-miss” calls, then iterate on descriptions.
                        - 'generic "MCP Tool Design: Why Your AI Agent Is Failing (And How to Fix It)" [ref=e382]':
                          - link "dev" [ref=e384] [cursor=pointer]:
                            - /url: https://dev.to/aws-heroes/mcp-tool-design-why-your-ai-agent-is-failing-and-how-to-fix-it-40fc
                            - generic [ref=e387]: dev
                  - paragraph [ref=e388]: Illustrative example
                  - list [ref=e389]:
                    - listitem [ref=e390]:
                      - paragraph [ref=e391]:
                        - text: "Problem: a tool “create_entity” has no description so the agent calls it without the required “id” and “type” fields, causing a validation error."
                        - generic "allMcpTool schema missing arguments field causes agents to call ..." [ref=e393]:
                          - link "cursor" [ref=e395] [cursor=pointer]:
