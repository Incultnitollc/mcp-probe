                  - paragraph [ref=e284]:
                    - text: "Short answer: If an MCP tool's description is missing (or is vague), agents will often choose the wrong tool or call it with incorrect or incomplete arguments, which causes failed calls or incorrect behavior."
                    - generic "allMcpTool schema missing arguments field causes agents to call ..." [ref=e286]:
                      - link "cursor" [ref=e288] [cursor=pointer]:
                        - /url: https://forum.cursor.com/t/allmcptool-schema-missing-arguments-field-causes-agents-to-call-mcp-tools-without-required-params/154996
                        - generic [ref=e291]: cursor
                  - paragraph [ref=e292]: Why missing descriptions matter
                  - list [ref=e293]:
                    - listitem [ref=e294]:
                      - paragraph [ref=e295]:
                        - text: The tool description tells the model the tool’s purpose, when to use it, and what the tool returns; without that, the agent can’t reliably decide which tool fits a task.
                        - generic "MCP Tool Descriptions Are Smelly and Costly - LinkedIn" [ref=e297]:
                          - link "linkedin" [ref=e299] [cursor=pointer]:
                            - /url: https://www.linkedin.com/posts/danielwebbuk_model-context-protocol-mcp-tool-descriptions-activity-7452688347128557568-oS5c
                            - generic [ref=e302]: linkedin
                    - listitem [ref=e303]:
                      - paragraph [ref=e304]:
                        - text: Missing parameter explanations lead the agent to omit required inputs or pass malformed values, producing validation errors at runtime.
                        - generic "allMcpTool schema missing arguments field causes agents to call ..." [ref=e306]:
                          - link "cursor" [ref=e308] [cursor=pointer]:
                            - /url: https://forum.cursor.com/t/allmcptool-schema-missing-arguments-field-causes-agents-to-call-mcp-tools-without-required-params/154996
                            - generic [ref=e311]: cursor
                    - listitem [ref=e312]:
                      - paragraph [ref=e313]:
                        - text: Ambiguous or absent descriptions increase mistaken tool selection and reduce task success; studies and incident reports show measurable drops in success when descriptions are low quality.
                        - generic [ref=e318] [cursor=pointer]:
                          - generic [ref=e319]: arxiv
                          - generic [ref=e320]: "+1"
                  - paragraph [ref=e321]: Common failure modes
                  - list [ref=e322]:
                    - listitem [ref=e323]:
                      - paragraph [ref=e324]:
                        - text: Calls without required arguments, triggering “missing/invalid arguments” errors.
                        - generic "allMcpTool schema missing arguments field causes agents to call ..." [ref=e326]:
                          - link "cursor" [ref=e328] [cursor=pointer]:
                            - /url: https://forum.cursor.com/t/allmcptool-schema-missing-arguments-field-causes-agents-to-call-mcp-tools-without-required-params/154996
                            - generic [ref=e331]: cursor
                    - listitem [ref=e332]:
                      - paragraph [ref=e333]:
                        - text: Calls to a tool that performs a different operation than the agent expected (wrong semantics), producing incorrect results.
                        - generic "MCP Tool Descriptions Are Smelly and Costly - LinkedIn" [ref=e335]:
                          - link "linkedin" [ref=e337] [cursor=pointer]:
                            - /url: https://www.linkedin.com/posts/danielwebbuk_model-context-protocol-mcp-tool-descriptions-activity-7452688347128557568-oS5c
                            - generic [ref=e340]: linkedin
                    - listitem [ref=e341]:
                      - paragraph [ref=e342]:
                        - text: Tools that are never used because their purpose is unclear, or overused because the model can’t distinguish alternatives.
                        - 'generic "MCP Tool Design: Why Your AI Agent Is Failing (And How to Fix It)" [ref=e344]':
                          - link "dev" [ref=e346] [cursor=pointer]:
                            - /url: https://dev.to/aws-heroes/mcp-tool-design-why-your-ai-agent-is-failing-and-how-to-fix-it-40fc
