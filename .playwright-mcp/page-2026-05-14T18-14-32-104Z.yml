                  - paragraph [ref=e154]:
                    - text: A missing description on an MCP tool usually makes the model much worse at choosing and using that tool correctly. It can still exist and be callable, but the agent has less context about when to pick it, what it does, and how to form the right arguments.
                    - 'generic "MCP tool descriptions: overview, examples, and best ..." [ref=e156]':
